<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">ZhangZhengLian — Creator of VelarOS</title>
  <desc id="desc">Building a personal AI operating system, its shared kernel, and an ecosystem of AI applications.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b12" />
      <stop offset="0.55" stop-color="#101828" />
      <stop offset="1" stop-color="#151027" />
    </linearGradient>
    <radialGradient id="glow-a" cx="0" cy="0" r="1" gradientTransform="translate(1100 30) rotate(140) scale(560 390)">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.42" />
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-b" cx="0" cy="0" r="1" gradientTransform="translate(150 380) rotate(-25) scale(520 300)">
      <stop offset="0" stop-color="#2c9aff" stop-opacity="0.30" />
      <stop offset="1" stop-color="#2c9aff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79c8ff" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#background)" />
  <rect width="1280" height="360" rx="28" fill="url(#glow-a)" />
  <rect width="1280" height="360" rx="28" fill="url(#glow-b)" />
  <path d="M0 290 C220 210 420 365 670 286 C900 214 1030 258 1280 170" fill="none" stroke="#fff" stroke-opacity="0.055" stroke-width="1.5" />
  <path d="M0 319 C248 239 430 388 690 306 C920 233 1060 275 1280 200" fill="none" stroke="#fff" stroke-opacity="0.035" stroke-width="1.5" />

  <g transform="translate(86 84)" filter="url(#shadow)">
    <rect width="192" height="192" rx="45" fill="#f8f8f7" />
    <rect x="8" y="8" width="176" height="176" rx="38" fill="none" stroke="#e4e4df" stroke-width="4" />
    <g transform="translate(12 34) scale(3.5)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 6 V25" stroke="#181818" stroke-width="2.1" />
      <path d="M24 7 C32 9 38 13 40 18 C34 20 29 23 24 28 Z" fill="#181818" />
      <path d="M28 10 C27 15 27 20 25 26" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.2" />
      <path d="M14 25 H36 L32 30 H18 Z" fill="#181818" />
      <path d="M18 27 H31" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.1" />
    </g>
  </g>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="330" y="98" fill="url(#accent)" font-size="17" font-weight="700" letter-spacing="4">CREATOR OF VELAROS</text>
    <text x="328" y="172" fill="#ffffff" font-size="58" font-weight="750" letter-spacing="-1.4">ZhangZhengLian</text>
    <text x="330" y="220" fill="#c7d0df" font-size="23" font-weight="450">Building the personal AI operating system.</text>
    <text x="330" y="270" fill="#8d9aae" font-size="16" font-weight="600" letter-spacing="1.2">PERSONAL AI OS  ·  SHARED KERNEL  ·  AI APPLICATION ECOSYSTEM</text>
  </g>

  <rect x="1" y="1" width="1278" height="358" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2" />
</svg>
